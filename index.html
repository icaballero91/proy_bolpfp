<html lang="es"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d2a33}
body{font-family:"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 55% at 50% 46%,rgba(8,28,36,.5),rgba(8,28,36,0) 70%),linear-gradient(180deg,rgba(8,28,36,.35),rgba(8,28,36,0) 30%,rgba(8,28,36,0) 70%,rgba(8,28,36,.45))}
.mist{position:fixed;left:-20%;width:140%;height:26vh;bottom:18vh;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(220,235,238,.35),rgba(220,235,238,0) 70%);filter:blur(10px);animation:drift 90s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 22px;text-align:center;
  animation:in 1.2s ease both;transition:opacity .5s,transform .5s}
.wrap.out{opacity:0;transform:scale(1.03)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{margin:0;font:400 clamp(26px,4.4vw,50px)/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;letter-spacing:.015em;text-shadow:0 2px 24px rgba(5,22,30,.55)}
.yr{display:flex;align-items:center;gap:16px;margin:18px 0 38px;font:500 12.5px/1 "Helvetica Neue",system-ui,sans-serif;letter-spacing:.5em;padding-left:.5em;color:rgba(255,255,255,.85)}
.yr::before,.yr::after{content:"";width:46px;height:1px;background:rgba(255,255,255,.5)}
form{display:flex;align-items:center;gap:4px;width:min(330px,84vw);padding:5px 5px 5px 18px;border-radius:999px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,.38);box-shadow:0 10px 34px rgba(4,20,28,.35);transition:border-color .25s,box-shadow .25s,background .25s}
form:focus-within{border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.17)}
form svg.lk{flex:none;width:17px;height:17px;color:rgba(255,255,255,.8)}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:500 15px/1 system-ui,sans-serif;letter-spacing:.2em;padding:13px 8px}
input::placeholder{color:rgba(255,255,255,.6);letter-spacing:.04em;font-weight:400}
button{flex:none;width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#0d2a33;background:rgba(255,255,255,.92);transition:transform .15s,background .2s}
button:hover{background:#fff}button:focus:not(:focus-visible){outline:none}button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.eye{width:34px;height:34px;background:transparent;color:rgba(255,255,255,.75)}button.eye:hover{background:rgba(255,255,255,.14);color:#fff}button.eye svg{width:18px;height:18px}button.eye .sl{display:none}button.eye[aria-pressed=true] .sl{display:block}
button svg{width:18px;height:18px}
button .sp{display:none;width:16px;height:16px;border:2.5px solid rgba(13,42,51,.2);border-top-color:#0d2a33;border-radius:50%;animation:spin .7s linear infinite}
button.ld svg{display:none}button.ld .sp{display:block}button:disabled{cursor:wait}
@keyframes spin{to{transform:rotate(360deg)}}
.err{height:18px;margin-top:14px;font:400 12.5px/18px system-ui,sans-serif;letter-spacing:.04em;color:#ffd9d4;opacity:0;transition:opacity .3s}
.err.on{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
form.bad{animation:shake .4s;border-color:rgba(255,160,150,.85)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

(function(){
  var cv=document.getElementById('c'),cx=cv.getContext('2d');
  function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function vnoise(seed){var r=rng(seed),L=[];for(var i=0;i<512;i++)L.push(r());
    return function(x){var i=Math.floor(x),f=x-i,a=L[i&511],b=L[(i+1)&511],u=f*f*(3-2*f);return a+(b-a)*u;};}
  function ridge(seed,oct,ridged){var ns=[];for(var i=0;i<oct;i++)ns.push(vnoise(seed+i*77));
    return function(x){var s=0,a=1,t=0,fr=1;for(var i=0;i<oct;i++){var n=ns[i](x*fr);if(ridged)n=1-Math.abs(2*n-1);s+=n*a;t+=a;a*=.5;fr*=2.07;}return s/t;};}
  function draw(){
    var dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    var g=cx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0f2f3d');g.addColorStop(.35,'#2c6272');g.addColorStop(.58,'#7fb0b0');g.addColorStop(.74,'#dcd2b0');g.addColorStop(.86,'#f1c995');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    var sx=W*.5,sy=H*.52,gl=cx.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*.42);
    gl.addColorStop(0,'rgba(255,236,190,.7)');gl.addColorStop(.25,'rgba(255,214,160,.32)');gl.addColorStop(1,'rgba(255,214,150,0)');
    cx.fillStyle=gl;cx.fillRect(0,0,W,H);
    var layers=[
      {seed:11,base:.56,amp:.30,oct:6,ridged:true, top:'#e9eff3',mid:'#9db7c7',bot:'#cfd6d3',snow:true,fr:2.6},
      {seed:23,base:.64,amp:.20,oct:6,ridged:true, top:'#8fabbb',mid:'#7d9aa8',bot:'#b6c3bd',fr:3.4},
      {seed:37,base:.72,amp:.15,oct:5,ridged:false,top:'#5f8791',mid:'#58808a',bot:'#97b0a6',fr:4},
      {seed:51,base:.80,amp:.11,oct:5,ridged:false,top:'#3c6a6a',mid:'#376565',bot:'#5f8a79',fr:5},
      {seed:67,base:.90,amp:.08,oct:4,ridged:false,top:'#16413f',mid:'#123a37',bot:'#0c2b2c',fr:6.5}
    ];
    layers.forEach(function(L,k){
      var f=ridge(L.seed,L.oct,L.ridged),pts=[],step=Math.max(2,W/420),off=L.seed*.37;
      for(var x=0;x<=W+step;x+=step){var n=f(x/W*L.fr+off);var y=H*L.base-(n-.35)*H*L.amp*2.2;
        if(k===0){var d=(x/W-.55);y-=H*.07*Math.exp(-d*d*12);}pts.push([x,y]);}
      var gg=cx.createLinearGradient(0,H*(L.base-L.amp*1.1),0,H*(L.base+.12));
      gg.addColorStop(0,L.top);gg.addColorStop(.45,L.mid);gg.addColorStop(1,L.bot);
      cx.beginPath();cx.moveTo(0,H);pts.forEach(function(p){cx.lineTo(p[0],p[1]);});cx.lineTo(W,H);cx.closePath();cx.fillStyle=gg;cx.fill();
      if(L.snow){
        cx.save();cx.clip();
        var sn=cx.createLinearGradient(0,H*(L.base-L.amp*1.1),0,H*(L.base+.02));
        sn.addColorStop(0,'rgba(255,255,255,.95)');sn.addColorStop(.38,'rgba(250,252,255,.75)');sn.addColorStop(.62,'rgba(240,246,250,0)');
        cx.fillStyle=sn;cx.fillRect(0,0,W,H);
        cx.restore();}
      var hz=cx.createLinearGradient(0,H*(L.base-.05),0,H*(L.base+.2));
      hz.addColorStop(0,'rgba(236,224,196,0)');hz.addColorStop(.6,'rgba(236,224,196,'+(k<4?.22:.1)+')');hz.addColorStop(1,'rgba(236,224,196,0)');
      cx.fillStyle=hz;cx.fillRect(0,H*(L.base-.05),W,H*.25);
      if(k===4){var r=rng(5);cx.fillStyle='#0a2427';for(var x=0;x<W;x+=5+r()*7){var i=Math.min(pts.length-1,Math.floor(x/step)),y=pts[i][1],h=8+r()*20;
        cx.beginPath();cx.moveTo(x-4,y+6);cx.lineTo(x,y-h);cx.lineTo(x+4,y+6);cx.closePath();cx.fill();}}
    });
    var gc=document.createElement('canvas');gc.width=gc.height=160;var gx=gc.getContext('2d'),id=gx.createImageData(160,160),r2=rng(9);
    for(var i=0;i<id.data.length;i+=4){var v=r2()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=22;}
    gx.putImageData(id,0,0);cx.globalCompositeOperation='overlay';cx.fillStyle=cx.createPattern(gc,'repeat');cx.fillRect(0,0,W,H);cx.globalCompositeOperation='source-over';
  }
  draw();var t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(draw,120);});
})();
